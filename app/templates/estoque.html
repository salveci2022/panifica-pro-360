<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Estoque - PANIFICA PRO 360</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef2f7;
    font-family:'Segoe UI',sans-serif;
}

.topo{
    background:#1351B4;
    color:white;
    padding:20px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

</style>

</head>
<body>

<div class="topo">
<h2>PANIFICA PRO 360 - Estoque</h2>
</div>

<div class="container mt-4">

<div class="card p-4">

<h3>Produtos em Estoque</h3>

<table class="table table-striped mt-3">

<thead>
<tr>
<th>ID</th>
<th>Produto</th>
<th>Quantidade</th>
<th>Unidade</th>
<th>Atualizado em</th>
</tr>
</thead>

<tbody>

{% for item in produtos %}

<tr>
<td>{{ item.id }}</td>
<td>{{ item.produto }}</td>
<td>{{ item.quantidade }}</td>
<td>{{ item.unidade }}</td>
<td>{{ item.atualizado_em.strftime("%d/%m/%Y %H:%M") }}</td>
</tr>

{% endfor %}

</tbody>

</table>

<a href="/dashboard" class="btn btn-primary">
Voltar ao Dashboard
</a>

</div>

</div>

</body>
</html>
