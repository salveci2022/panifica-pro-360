<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Produção - PANIFICA PRO 360</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef2f7;
    font-family:'Segoe UI',sans-serif;
}

.topo{
    background:#1351B4;
    color:white;
    padding:20px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="topo">
    <h2>PANIFICA PRO 360 - Produção</h2>
</div>

<div class="container mt-4">

    <div class="card p-4 mb-4">

        <h3>Nova Produção</h3>

        <form method="POST">

            <div class="row">

                <div class="col-md-6">
                    <label class="form-label">Produto Produzido</label>

                    <select
                        name="produto"
                        class="form-control"
                        required>

                        {% for produto in produtos %}
                        <option value="{{ produto.produto }}">
                            {{ produto.produto }}
                        </option>
                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-4">
                    <label class="form-label">Quantidade</label>

                    <input
                        type="number"
                        step="0.01"
                        name="quantidade"
                        class="form-control"
                        required>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button
                        type="submit"
                        class="btn btn-success w-100">
                        Produzir
                    </button>
                </div>

            </div>

        </form>

    </div>

    <div class="card p-4">

        <h3>Produções Realizadas</h3>

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Data</th>
                </tr>
            </thead>

            <tbody>

                {% for item in producoes %}

                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.produto }}</td>
                    <td>{{ item.quantidade }}</td>
                    <td>{{ item.data.strftime("%d/%m/%Y") }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

        <a href="/dashboard" class="btn btn-primary">
            Voltar ao Dashboard
        </a>

    </div>

</div>

</body>
</html>
