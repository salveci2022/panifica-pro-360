<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PANIFICA PRO 360 - Financeiro</title>

<style>

body{
    background:#eef2f7;
    font-family:Arial, Helvetica, sans-serif;
    margin:0;
}

.topo{
    background:#1351B4;
    color:white;
    padding:20px;
}

.container{
    padding:30px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-top:5px;
    margin-bottom:15px;
}

button{
    background:#198754;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#157347;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1351B4;
    color:white;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:left;
}

.voltar{
    display:inline-block;
    margin-top:20px;
    background:#1351B4;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="topo">
    <h2>PANIFICA PRO 360 - Financeiro</h2>
</div>

<div class="container">

    <div class="card">

        <h3>Nova Receita</h3>

        <form method="POST">

            <label>Descrição</label>

            <input
                type="text"
                name="descricao"
                placeholder="Ex: Venda Balcão"
                required
            >

            <label>Valor</label>

            <input
                type="number"
                step="0.01"
                name="valor"
                required
            >

            <button type="submit">
                Salvar Receita
            </button>

        </form>

    </div>

    <div class="card">

        <h3>Receitas Cadastradas</h3>

        <table>

            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Data</th>
            </tr>

            {% for receita in receitas %}

            <tr>
                <td>{{ receita.id }}</td>
                <td>{{ receita.descricao }}</td>
                <td>R$ {{ "%.2f"|format(receita.valor) }}</td>
                <td>{{ receita.criado_em.strftime('%d/%m/%Y') }}</td>
            </tr>

            {% endfor %}

        </table>

        <a href="/dashboard" class="voltar">
            Voltar ao Dashboard
        </a>

    </div>

</div>

</body>
</html>
