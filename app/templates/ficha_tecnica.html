<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Ficha Técnica - PANIFICA PRO 360</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef2f7;
font-family:'Segoe UI',sans-serif;
}

.topo{
background:#1351B4;
color:white;
padding:20px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="topo">
<h2>PANIFICA PRO 360 - Ficha Técnica</h2>
</div>

<div class="container mt-4">

<div class="card p-4 mb-4">

<h3>Nova Receita</h3>

<form method="POST">

<div class="row">

<div class="col-md-3">
<label>Produto Final</label>
<input
type="text"
name="produto_final"
class="form-control"
required>
</div>

<div class="col-md-3">
<label>Ingrediente</label>
<input
type="text"
name="ingrediente"
class="form-control"
required>
</div>

<div class="col-md-2">
<label>Quantidade</label>
<input
type="number"
step="0.01"
name="quantidade"
class="form-control"
required>
</div>

<div class="col-md-2">
<label>Unidade</label>
<input
type="text"
name="unidade"
value="Kg"
class="form-control">
</div>

<div class="col-md-2 d-flex align-items-end">
<button
type="submit"
class="btn btn-success w-100">
Salvar
</button>
</div>

</div>

</form>

</div>

<div class="card p-4">

<h3>Receitas Cadastradas</h3>

<table class="table table-striped">

<thead>
<tr>
<th>ID</th>
<th>Produto Final</th>
<th>Ingrediente</th>
<th>Quantidade</th>
<th>Unidade</th>
</tr>
</thead>

<tbody>

{% for item in receitas %}

<tr>
<td>{{ item.id }}</td>
<td>{{ item.produto_final }}</td>
<td>{{ item.ingrediente }}</td>
<td>{{ item.quantidade }}</td>
<td>{{ item.unidade }}</td>
</tr>

{% endfor %}

</tbody>

</table>

<a href="/dashboard" class="btn btn-primary">
Voltar ao Dashboard
</a>

</div>

</div>

</body>
</html>
