<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Produtos - PANIFICA PRO 360</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef2f7;
    font-family:'Segoe UI',sans-serif;
}

.topo{
    background:#1351B4;
    color:white;
    padding:20px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="topo">
    <h2>PANIFICA PRO 360 - Produtos</h2>
</div>

<div class="container mt-4">

<div class="card p-4 mb-4">

<h3>Novo Produto</h3>

<form method="POST">

<div class="row">

<div class="col-md-3 mb-3">
<label>Produto</label>
<input
type="text"
name="nome"
class="form-control"
required>
</div>

<div class="col-md-3 mb-3">
<label>Categoria</label>
<input
type="text"
name="categoria"
class="form-control">
</div>

<div class="col-md-2 mb-3">
<label>Unidade</label>
<input
type="text"
name="unidade"
value="Kg"
class="form-control">
</div>

<div class="col-md-2 mb-3">
<label>Estoque Mínimo</label>
<input
type="number"
step="0.01"
name="estoque_minimo"
value="0"
class="form-control">
</div>

<div class="col-md-2 mb-3 d-flex align-items-end">
<button
type="submit"
class="btn btn-success w-100">
Salvar
</button>
</div>

</div>

</form>

</div>

<div class="card p-4">

<h3>Produtos Cadastrados</h3>

<table class="table table-striped">

<thead>
<tr>
<th>ID</th>
<th>Produto</th>
<th>Categoria</th>
<th>Unidade</th>
<th>Estoque Mínimo</th>
</tr>
</thead>

<tbody>

{% for produto in produtos %}

<tr>
<td>{{ produto.id }}</td>
<td>{{ produto.nome }}</td>
<td>{{ produto.categoria }}</td>
<td>{{ produto.unidade }}</td>
<td>{{ produto.estoque_minimo }}</td>
</tr>

{% endfor %}

</tbody>

</table>

<a href="/dashboard" class="btn btn-primary">
Voltar ao Dashboard
</a>

</div>

</div>

</body>
</html>
